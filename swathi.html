<!DOCTYPE html>
<html>
<head>
  <title> Beach Tour Packages </title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #eaf2f8;
    }
    h1 {
      text-align: center;
      color: #000080;
    }
    h2 {
      text-align: center;
      color: #006699;
    }
    h3 {
      text-align: center;
      color: #0099cc;
    }
    .container {
      width: 800px;
      margin: 0 auto;
    }
    .package-box {
      width: 300px;
      height: 300px;
      background-color: #ffffff;
      margin: 15px;
      float: left;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0px 0px 5px 0px rgba(0,0,0,0.2);
    }
    .package-box:hover {
      cursor: pointer;
      background-color: #f2f2f2;
    }
    .package-desc {
      text-align: center;
      font-size: 1.2em;
    }
    .clear {
      clear: both;
    }
  </style>
</head>
<body>
  <h1> Beach Tour Packages </h1>
  <div class="container">
    <div class="package-box">
      <img src="https://i.pinimg.com/originals/7b/b5/6b/7bb56bbd76fee90c3208918f52ef21d9.jpg" alt="Goa" width="200" height="200">
      <div class="package-desc">
        <h2>Goa</h2>
        <h3>5 Days/4 Nights</h3>
      </div>
    </div>
    <div class="package-box">
      <img src="https://i.pinimg.com/736x/ee/23/8e/ee238e2e159f47a7b722b28d5b69d10a.jpgalt" alt="Kerala" width="200" height="200">
      <div class="package-desc">
        <h2>Kerala</h2>
        <h3>7 Days/6 Nights</h3>
      </div>
    </div>
    <div class="package-box">
      <img src="https://imgk.timesnownews.com/story/Gateway-of-India_AP.jpg?tr=w-400,h-300,fo-auto" alt="Maharashtra" width="200" height="200">
      <div class="package-desc">
        <h2>Maharashtra</h2>
        <h3>6 Days/5 Nights</h3>
      </div>
    </div>
    <div class="clear"></div>
  </div>
</body>
</html>
