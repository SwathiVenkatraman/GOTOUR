
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: url("https://wallpapercave.com/wp/wp2005056.jpg") no-repeat center center/cover;
    }
   
    .form-container {
      margin-top: 120px; /* prevent navbar overlap */
      background: rgba(255,255,255,0.95);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 6px 18px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #00bcd4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: #008c9e;
    }
    .links {
      text-align: center;
      margin-top: 10px;
    }
    .links a {
      text-decoration: none;
      color: #00bcd4;
      font-weight: 600;
    }
  </style>
</head>
<body>
 

  <div class="form-container">
    <h2>Login</h2>
    <form>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>
      <a href="destination.html">btn" type="submit">Login</button></a>
    </form>
    <div class="links">
      <p><a href="forgotpass.html">Forgot Password?</a></p>
      <p>Don’t have an account? <a href="signin.html">Sign Up</a></p>
    </div>
  </div>
</body>
</html>
