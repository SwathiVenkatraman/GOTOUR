<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
        font-family:"Poppins",sans-serif;
    margin:0;background:url("https://wallpapercave.com/wp/wp2688881.jpg") no-repeat center center/cover;
    margin-top:150px;
}
    .form-container {
        margin-top:120px;
        background:rgba(255,255,255,0.95);
        max-width:400px;
        margin:auto;
        padding:30px;
        border-radius:12px;
        box-shadow:0px 6px 18px rgba(0,0,0,0.3);}
    h2{
        text-align:center;
        margin-bottom:20px;
    }
    .form-group{
        margin-bottom:15px;
    }
    label{
        display:block;
        margin-bottom:5px;
        font-weight:600;
    }
    input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
    }
    .btn{
        width:100%;
        padding:12px;
        background:#00bcd4;
        color:#fff;
        border:none;
        border-radius:8px;
        font-size:16px;
        font-weight:600;
        cursor:pointer;
        margin-top:10px;
    }
    .btn:hover{
        background:#008c9e;
    }
    .links{
        text-align:center;
        margin-top:10px;
    }
    .links a{
        text-decoration:none;
        color:#00bcd4;
        font-weight:600;}
  </style>
</head>
<body>
 

  <div class="form-container">
    <h2>Forgot Password</h2>
    <form>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your registered email" required>
      </div>
      <button class="btn" type="submit">Reset Password</button>
    </form>
    <div class="links">
      <p>Remember your password? <a href="login.html">Login</a></p>
    </div>
  </div>
</body>
</html>
